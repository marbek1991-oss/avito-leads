name: Resolve Avito digest listing links (private test)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check canonical Avito listing URLs without publishing tokens
        env:
          MAILRU_EMAIL: ${{ vars.MAILRU_EMAIL }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
        run: python scripts/resolve_avito_mail.py
